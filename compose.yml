services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: ${POSTGRES_USER:-notifications}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
    ports:
      - "127.0.0.1:15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notifications} -d notifications"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - notifications:/var/lib/postgresql/data
  receiver:
    image: nginx:alpine
    volumes:
      - ./docker/receiver.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:18081:8080"
volumes:
  notifications:
