spring:
  application:
    name: notification-service
  jackson:
    deserialization:
      fail-on-numbers-for-enums: true
  datasource:
    url: ${NOTIFICATIONS_DB_URL:jdbc:postgresql://localhost:15433/notifications}
    username: ${POSTGRES_USER:notifications}
    password: ${POSTGRES_PASSWORD:local-demo-password}
notifications:
  api-key: ${NOTIFICATIONS_API_KEY}
  service-targets: ${NOTIFICATIONS_SERVICE_TARGETS:}
  worker:
    enabled: true
    concurrency: 4
    poll-ms: 250
logging:
  structured:
    format:
      console: logstash
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
